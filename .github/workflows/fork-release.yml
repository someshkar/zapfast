name: Fork release

# Builds unsigned binaries of this fork for Linux, macOS and Windows and
# attaches them to a GitHub release. Upstream's release.yml is not used here:
# it signs and notarizes with keys this fork does not have.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (defaults to the selected branch's release version)"
        required: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="$GITHUB_REF_NAME"
          elif [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="v$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)-fork"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  linux:
    name: linux-x86_64
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev \
            libasound2-dev libpipewire-0.3-dev clang libclang-dev cmake perl
      - name: Build
        run: cargo build --locked --release
      - name: Package
        shell: bash
        run: |
          name="zapfast-${{ needs.version.outputs.tag }}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/$name"
          cp target/release/zapfast "dist/$name/"
          cp README.md LICENSE THIRD-PARTY-NOTICES.md packaging/zapfast-portable.txt "dist/$name/"
          cp --parents packaging/applications/zapfast.desktop packaging/icons/zapfast.svg "dist/$name/"
          cd dist && tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/*.tar.gz
          if-no-files-found: error

  windows:
    name: windows-x86_64
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --locked --release
      - name: Package
        shell: bash
        run: |
          name="zapfast-${{ needs.version.outputs.tag }}-x86_64-pc-windows-msvc"
          mkdir -p "dist/$name"
          cp target/release/zapfast.exe "dist/$name/"
          cp README.md LICENSE THIRD-PARTY-NOTICES.md packaging/zapfast-portable.txt "dist/$name/"
          cd dist && 7z a "$name.zip" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/*.zip
          if-no-files-found: error

  macos:
    name: macos-arm64
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --locked --release
      - name: Package
        shell: bash
        run: |
          version="${{ needs.version.outputs.tag }}"
          name="zapfast-${version}-macos-arm64"
          mkdir -p dist
          # Ad-hoc signature only: this fork has no Developer ID.
          bash packaging/macos/bundle.sh target/release/zapfast "dist/ZapFast.app" "${version#v}"
          cp README.md LICENSE THIRD-PARTY-NOTICES.md dist/
          cd dist && zip -qry "$name.zip" ZapFast.app README.md LICENSE THIRD-PARTY-NOTICES.md
          rm -rf ZapFast.app README.md LICENSE THIRD-PARTY-NOTICES.md
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: publish
    needs: [version, linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ZapFast fork ${{ needs.version.outputs.tag }} (link previews)
          draft: false
          prerelease: true
          generate_release_notes: false
          body: |
            Unsigned builds of this fork, which adds link previews the sender's
            own machine generates.

            * Composer reads the page of a link you are about to send and shows
              the card before you send it.
            * The sent message carries that title, description and thumbnail,
              so every device and every recipient sees the preview.
            * Only a link in your own draft is fetched. Links other people send
              are never opened.
            * Private, loopback and link-local addresses are refused on every
              redirect hop.
            * **Settings → Chats → Preview links** turns it off.

            Builds: `x86_64-unknown-linux-gnu` and `aarch64-apple-darwin` (Apple
            Silicon) plus `x86_64-pc-windows-msvc`.

            macOS is ad-hoc signed: on first launch, right-click → Open, or run
            `xattr -dr com.apple.quarantine /Applications/ZapFast.app`.
          files: dist/*
