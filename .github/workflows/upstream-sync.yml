name: Upstream sync

# Replays this fork's own commits on top of crmne/zapfast's main, so the link
# previews keep working while upstream's fixes and features arrive. `main` is
# only ever upstream's history with the fork's commits on top; see FORK.md.
#
# The replay needs a person when upstream and the fork change the same lines.
# Then nothing is pushed to main: the half-replayed branch is published as
# `upstream-sync/next`, an issue lists the files to resolve, and the run fails
# so the red mark is the notification.
on:
  schedule:
    # Upstream merges most days, so one pass a day keeps the fork close without
    # another cron entry to explain.
    - cron: "43 3 * * *"
  workflow_dispatch:
    inputs:
      verify:
        description: Build and test the replayed tree before pushing main
        type: boolean
        default: true

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: crmne/zapfast
  CARGO_TERM_COLOR: always

jobs:
  sync:
    name: sync
    runs-on: ubuntu-latest
    # A cold build of the replayed tree is the long part; cached runs are
    # minutes. The replay itself is seconds.
    timeout-minutes: 90
    steps:
      - name: Check out the fork's main
        uses: actions/checkout@v7
        with:
          ref: main
          # Full history: the replay needs the merge base with upstream.
          fetch-depth: 0
          # A token of its own where one is configured. Commits pushed with
          # GITHUB_TOKEN start no workflow, so with the default token the CI run
          # on the replayed main has to be started by hand below.
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Say whether this token may publish
        env:
          HAVE_SYNC_TOKEN: ${{ secrets.SYNC_TOKEN != '' }}
        run: |
          if [ "$HAVE_SYNC_TOKEN" = "true" ]; then
            echo "SYNC_TOKEN is set, so the replay can be published." 
          else
            echo "::warning::No SYNC_TOKEN secret. A replay that changes" \
              ".github/workflows needs a token with the Workflows permission," \
              "which GITHUB_TOKEN does not have. See FORK.md."
          fi

      - name: Fetch upstream
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream main

      - name: Replay the fork's commits on upstream's main
        id: sync
        # A conflict is a result to report, not a crash: the steps below hand it
        # over and fail the run on purpose.
        continue-on-error: true
        run: .github/scripts/sync-upstream.sh

      - name: Install GUI build dependencies
        if: >-
          steps.sync.outputs.changed == 'true' &&
          !(github.event_name == 'workflow_dispatch' && inputs.verify == false)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libasound2-dev libpipewire-0.3-dev clang libclang-dev cmake perl

      - name: Check the replayed tree
        if: >-
          steps.sync.outputs.changed == 'true' &&
          !(github.event_name == 'workflow_dispatch' && inputs.verify == false)
        # rust-toolchain.toml pins the compiler and names rustfmt and clippy, so
        # rustup installs exactly what CI uses on the first cargo command.
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets

      - name: Push the replayed main
        if: steps.sync.outputs.changed == 'true'
        run: |
          git push --force-with-lease origin HEAD:main || {
            echo "::error::The replay could not be published. A push that" \
              "carries upstream's .github/workflows changes needs a token with" \
              "the Workflows permission: set the SYNC_TOKEN secret. See FORK.md."
            exit 1
          }

      - name: Start CI on the replayed main
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
        # Named workflow dispatch is one of the two events GITHUB_TOKEN may
        # start, so this works with either token. With SYNC_TOKEN the push
        # already started CI and the concurrency group cancels the duplicate.
        run: gh workflow run ci.yml --ref main

      - name: Hand over a conflicting replay
        if: steps.sync.outputs.changed == 'conflict'
        # The replay is already published, and this script is no longer in the
        # working tree the sync switched away from, so the instructions go in
        # the run summary rather than in an issue. Issues are disabled here
        # anyway.
        run: |
          {
            printf '## Upstream sync needs a resolution\n\n'
            printf 'Upstream moved to `%s` and the fork commit **%s** no longer\n' \
              "${{ steps.sync.outputs.upstream_sha }}" \
              "${{ steps.sync.outputs.conflict_subject }}"
            printf 'applies on its own. Nothing was pushed to `main`.\n\n'
            printf 'The replay so far is on `%s`, with the conflict markers\n' \
              "${{ steps.sync.outputs.work_branch }}"
            printf 'committed. To finish it:\n\n'
            printf '```sh\n'
            printf 'git fetch origin %s\n' "${{ steps.sync.outputs.work_branch }}"
            printf 'git switch %s\n' "${{ steps.sync.outputs.work_branch }}"
            printf '# resolve the markers in: %s\n' "${{ steps.sync.outputs.conflict_files }}"
            printf 'git commit --all --amend\n'
            printf 'git push --force-with-lease origin HEAD:main\n'
            printf '```\n\n'
            printf 'Amend it into the commit it belongs to, because the next sync replays\n'
            printf 'that same commit and a resolution that lives only in `main` is\n'
            printf 'replayed away tomorrow. FORK.md has the longer version.\n'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Summarize
        if: always()
        run: |
          {
            printf '### Upstream sync\n\n'
            printf '| | |\n|---|---|\n'
            printf '| upstream | `%s` |\n' "${{ steps.sync.outputs.upstream_sha }}"
            printf '| new upstream commits | %s |\n' "${{ steps.sync.outputs.upstream_commits }}"
            printf '| replayed | %s |\n' "${{ steps.sync.outputs.replayed }}"
            printf '| skipped | %s |\n' "${{ steps.sync.outputs.skipped }}"
            printf '| result | %s |\n' "${{ steps.sync.outputs.changed }}"
          } >>"$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.sync.outputs.changed }}" = "true" ]; then
            {
              printf '\nThe binaries on the releases page are built from `main` on our own\n'
              printf 'machines, so they still carry the previous version:\n\n'
              printf '```sh\nscripts/fork-release.sh vX.Y.Z-fork.N\n```\n'
            } >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail on a replay that did not finish
        if: steps.sync.outcome == 'failure'
        run: exit 1
